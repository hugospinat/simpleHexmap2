spring:
  application:
    name: simplehex-backend
  datasource:
    url: ${HEXMAP_DB_URL:jdbc:h2:mem:simplehex;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${HEXMAP_DB_USERNAME:sa}
    password: ${HEXMAP_DB_PASSWORD:}
    driver-class-name: ${HEXMAP_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info